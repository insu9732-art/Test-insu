name: Android APK

on:
  push:
    branches: [main, master, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu 러너에는 Android SDK 가 미리 설치되어 있다 (ANDROID_HOME)
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 서명 키를 빌드 사이에 유지해야 새 APK 가 기존 앱 위에 업데이트 설치된다.
      # 저장소 비밀값 SAJU_KEYSTORE_B64 가 있으면 그것을 쓰고(영구), 없으면 캐시에 둔 키를 쓴다.
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/saju-signing
          key: saju-signing-v1

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.SAJU_KEYSTORE_B64 }}
          KEY_PASS: ${{ secrets.SAJU_KEY_PASS }}
        run: |
          mkdir -p ~/saju-signing
          PASS="${KEY_PASS:-saju-signing-key}"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/saju-signing/saju.jks
          elif [ ! -f ~/saju-signing/saju.jks ]; then
            keytool -genkeypair -keystore ~/saju-signing/saju.jks -alias saju -keyalg RSA -keysize 2048 \
              -validity 36500 -storepass "$PASS" -keypass "$PASS" -dname "CN=Insu Tojeong, O=insu9732-art, C=KR"
            echo "새 서명 키를 만들었습니다"
          fi
          keytool -list -v -keystore ~/saju-signing/saju.jks -storepass "$PASS" | grep -m1 'SHA256:'
          echo "SAJU_KEYSTORE=$HOME/saju-signing/saju.jks" >> "$GITHUB_ENV"
          echo "SAJU_KEY_PASS=$PASS" >> "$GITHUB_ENV"

      - name: Test saju engine
        run: npm test

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk saju.apk

      - uses: actions/upload-artifact@v4
        with:
          name: saju-apk
          path: saju.apk

      # 휴대폰에서 바로 받을 수 있도록 'apk-latest' 릴리스에 올린다
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 사주풀이 APK (최신)
          prerelease: true
          make_latest: false
          body: |
            안드로이드 휴대폰에서 아래 **saju.apk** 를 눌러 내려받아 설치하세요.
            커밋: ${{ github.sha }}
          files: saju.apk
