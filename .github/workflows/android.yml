name: Android APK

on:
  push:
    branches: [main, master, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu 러너에는 Android SDK 가 미리 설치되어 있다 (ANDROID_HOME)
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 서명 키를 빌드 사이에 유지해야 새 APK 가 기존 앱 위에 업데이트 설치된다
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: saju-debug-keystore-v1

      - name: Test saju engine
        run: npm test

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk saju.apk

      - uses: actions/upload-artifact@v4
        with:
          name: saju-apk
          path: saju.apk

      # 휴대폰에서 바로 받을 수 있도록 'apk-latest' 릴리스에 올린다
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 사주풀이 APK (최신)
          prerelease: true
          make_latest: false
          body: |
            안드로이드 휴대폰에서 아래 **saju.apk** 를 눌러 내려받아 설치하세요.
            커밋: ${{ github.sha }}
          files: saju.apk
