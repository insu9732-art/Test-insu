plugins {
    id 'com.android.application'
}

android {
    namespace 'com.saju.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.saju.app'
        minSdk 24
        targetSdk 34
        // GitHub Actions 실행 번호를 버전으로 써서 새 APK 가 기존 앱 위에 업데이트되게 한다
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
        versionName "1.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    buildTypes {
        release {
            minifyEnabled false
            // 개인 설치용: 디버그 키로 서명 (워크플로가 키를 캐시해 빌드마다 같은 키를 쓴다)
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 웹앱(index.html, js, css)을 HTML 하나로 묶어 assets 에 넣는다
tasks.register('bundleWebApp', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'python3', 'tools/bundle.py', 'android', "${projectDir}/src/main/assets/index.html"
}
tasks.named('preBuild') { dependsOn 'bundleWebApp' }
