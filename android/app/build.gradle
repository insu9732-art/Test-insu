plugins {
    id 'com.android.application'
}

android {
    namespace 'com.saju.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.saju.app'
        minSdk 24
        targetSdk 34
        // GitHub Actions 실행 번호를 버전으로 써서 새 APK 가 기존 앱 위에 업데이트되게 한다
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
        versionName "1.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    // 업데이트 설치가 되려면 모든 빌드가 같은 키로 서명돼야 한다.
    // 워크플로가 SAJU_KEYSTORE(고정 키 파일)를 넘겨 주고, 없으면(내 컴퓨터 빌드) 디버그 키를 쓴다.
    def keystore = System.getenv('SAJU_KEYSTORE')
    signingConfigs {
        if (keystore) {
            saju {
                storeFile file(keystore)
                storePassword System.getenv('SAJU_KEY_PASS')
                keyAlias 'saju'
                keyPassword System.getenv('SAJU_KEY_PASS')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystore ? signingConfigs.saju : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 웹앱(index.html, js, css)을 HTML 하나로 묶어 assets 에 넣는다
tasks.register('bundleWebApp', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'python3', 'tools/bundle.py', 'android', "${projectDir}/src/main/assets/index.html"
}
tasks.named('preBuild') { dependsOn 'bundleWebApp' }
