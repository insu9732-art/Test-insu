<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap" rel="stylesheet"><style>
html,body{margin:0}body{width:2560px;height:1440px;overflow:hidden;font-family:'Jua'}
.bg{position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 50%,#3D7BFF 0 6deg,#2F66E8 6deg 12deg)}
.dots{position:absolute;inset:0;background-image:radial-gradient(#ffffff22 4px,transparent 5px);background-size:40px 40px}
/* safe area 1546x423 centered */
.safe{position:absolute;left:507px;top:508px;width:1546px;height:423px;display:flex;align-items:center;gap:40px}
.sun{width:400px;height:400px;flex:none}
.txt{flex:1}
.title{font-family:'Black Han Sans';font-size:210px;line-height:1;color:#FFD23F;-webkit-text-stroke:16px #1B1B1B;paint-order:stroke fill;text-shadow:0 14px 0 #1B1B1B}
.tag{margin-top:28px;display:inline-block;background:#fff;border:8px solid #1B1B1B;border-radius:24px;padding:10px 34px;font-size:66px;color:#1B1B1B;box-shadow:0 10px 0 #1B1B1B;transform:rotate(-2deg)}
.tag b{color:#FF5A3C;font-weight:normal}
.sched{position:absolute;right:0;top:0;background:#FF5A3C;color:#fff;border:7px solid #1B1B1B;border-radius:18px;padding:6px 22px;font-size:44px;transform:rotate(6deg);box-shadow:0 7px 0 #1B1B1B}
.emo{position:absolute;font-size:150px;filter:drop-shadow(0 8px 0 #0003)}
</style></head><body><div class="bg"></div><div class="dots"></div>
